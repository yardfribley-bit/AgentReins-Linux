<script>(()=>{const root=document.getElementById('ar-workbench'),view=root.querySelector('#ar-view');let state={page:'task',step:3,incident:false};let platform={},sync={},summaries=[],task=null,rows=[],queryResult=null,loading=false;const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pill=(v,cls='')=>'<span class="ar-pill '+cls+'">'+esc(v)+'</span>';const panel=(title,body,badge='')=>'<section class="ar-panel"><div class="ar-panelhead"><h3>'+title+'</h3>'+badge+'</div><div class="ar-panelbody">'+body+'</div></section>';const kv=items=>'<dl class="ar-kv">'+items.map(([k,v])=>'<div><dt>'+k+'</dt><dd>'+esc(v)+'</dd></div>').join('')+'</dl>';const bytes=v=>Number.isFinite(v)?(v/1073741824).toFixed(1)+' GB':'未采集';const count=(k)=>platform.taskCounts?.[k]??'—';const ts=()=>task?.tools||[];const trace=()=>ts().find(t=>t.traceId)?.traceId||'未关联';const cid=()=>ts().find(t=>t.runtimeContainerId)?.runtimeContainerId?.slice(0,12)||'未关联';const pid=()=>ts().find(t=>t.runtimeHostPid)?.runtimeHostPid||'未关联';const groupId=j=>j.runId||j.id.split(':')[0];const head=(title,sub)=>'<div class="ar-row ar-between"><div><h2>'+title+'</h2><p class="ar-muted ar-small">'+esc(sub)+'</p></div>'+pill('真实采集 · 只读')+'</div>';async function get(path){let r=await fetch('/dify/api/'+path,{cache:'no-store'});let d=await r.json();if(!r.ok)throw Error(d.error||'HTTP '+r.status);return d}function identity(){let t=ts().find(t=>t.runtimeContainerId)||ts()[0];return '<aside class="ar-inspector"><div class="ar-panelhead"><h3>关联证据</h3>'+pill(t?.association==='EXECUTOR_CONTAINER_ID'?'直接容器身份':'候选 / 未确认',t?.association==='EXECUTOR_CONTAINER_ID'?'ar-green':'ar-amber')+'</div><div class="ar-panelbody">'+kv([['Trace ID',trace()],['执行容器',cid()],['宿主 PID',pid()],['关联依据',t?.associationNote||'尚未关联运行时'],['任务运行 ID',task?.runId]])+'</div></aside>'}function selectedPicker(){let groups=[...new Map(summaries.map(j=>[groupId(j),j])).entries()];return '<label function observationCoverage(name){return ({API:['执行 API','任务 / 节点 / 模型结果；非入口请求追踪'],Worker:['容器指标','未接入 Celery 入队、领取及重试链路'],'Worker beat':['容器指标','未关联定时任务到工作流'],'Plugin daemon':['容器指标','工具结果来自 Dify API；未追踪 daemon 内部调用'],Sandbox:['容器指标','通用代码节点未逐次关联执行进程'],'Local sandbox':['容器指标','仅固定研究执行器有直接任务身份'],'Agent backend':['容器指标','未接入 Go Runtime 内部执行事件'],Redis:['指标 / 受限内容','INFO、键预览；未关联任务读写'],PostgreSQL:['可用性探针','未采集 SQL 或任务关联']})[name]||['容器指标','未接入组件内部请求追踪']}
function coveragePanel(){return panel('观测覆盖 · 与组件健康独立','<p class="ar-muted">容器运行不等于内部链路已接入。下表描述当前已部署采集范围，不代表每条历史任务都有完整证据。</p><table class="ar-table"><thead><tr><th>组件</th><th>运行状态</th><th>已接入观测 / 缺口</th></tr></thead><tbody>'+(platform.services||[]).map(x=>{let c=observationCoverage(x.name);return '<tr><td>'+esc(x.name)+'</td><td>'+esc(x.health||x.state)+'</td><td><strong>'+c[0]+'</strong><p>'+c[1]+'</p></td></tr>'}).join('')+'</tbody></table><div class="ar-callout">工作流引擎：通过 Dify 节点执行 API 采集，未接入 OTel spans。固定研究执行器：已记录 Trace、容器、宿主 PID，并关联 audit 证据。跨组件边未采集时不绘制成功链路。</div>')}

function overview(){let fresh=platform.sampledAt&&Date.now()/1000-platform.sampledAt<45;let healthy=platform.services?.filter(s=>s.state==='running'&&s.health!=='unhealthy').length||0;let n=platform.services?.length||0;const topology=[['入口层','Web','Nginx'],['编排层','API','Worker','Worker beat','Agent backend'],['能力层','Plugin daemon','Sandbox','Local sandbox'],['依赖层','Redis','PostgreSQL','SSRF proxy','Agent proxy']];const metric=(label,value,sub)=>'<div><label>'+label+'</label><strong>'+esc(value)+'</strong><small>'+esc(sub)+'</small></div>';const serviceRows=topology.map(([layer,...names])=>'<div class="ar-topology-lane"><div class="ar-lane-title">'+layer+'</div><div class="ar-topology-nodes">'+names.map(name=>{let s=platform.services?.find(s=>s.name===name);let bad=s&&(s.state!=='running'||s.health==='unhealthy');return '<button class="cursor-interaction ar-service '+(bad?'ar-service-error':'')+'" data-service="'+name+'"><span class="ar-service-indicator" style="background:'+(bad?'var(--ar-amber)':fresh&&s?'var(--ar-green)':'var(--ar-sub)')+'"></span><strong>'+name+'</strong><small>'+esc(!fresh?'采样过期 / 未采集':s?(s.health||s.state):'未发现组件')+'</small><small>观测：'+esc(observationCoverage(name)[0])+'</small></button>'}).join('')+'</div></div>').join('');let resources=platform.resources||{},running=(sync.live?.runs||[]).filter(r=>r.status==='running');let activeTasks=running.slice(0,4).map(r=>'<div class="ar-task"><strong>'+esc(r.appName)+'</strong><p class="ar-muted ar-small">'+esc(r.query||r.runId)+'</p>'+pill(r.status)+'</div>').join('');let bars=(platform.trend||[]).slice(-24);let trend=bars.length?'<div style="display:flex;align-items:end;gap:3px;height:65px;margin:8px 0;border-bottom:1px solid var(--ar-line)">'+bars.map(x=>'<div style="flex:1;background:var(--ar-blue);height:'+Math.max(2,Math.min(60,x.running*14))+'px" title="'+esc(new Date(x.time*1000).toLocaleTimeString()+' · '+x.running+' 运行中')+'"></div>').join('')+'</div>':'<div class="ar-empty-grid"></div>';let collectors=Object.values(platform.collectors||{});let gaps=platform.knownGaps||[];return '<div class="ar-screen-head"><div><div class="ar-screen-eyebrow">DIFY OPERATIONS / LIVE SITUATION</div><h2>Dify 全局运行态势</h2><p class="ar-muted ar-small">服务、任务、资源、模型与隔离环境，同一时刻的运行视图</p></div><div class="ar-screen-mode">'+pill(fresh?'实时快照':'等待 / 数据延迟',fresh?'ar-green':'ar-amber')+'<div class="ar-row" style="margin-top:8px"><button id="ar-platform-refresh" class="cursor-interaction">刷新状态</button><span class="ar-muted ar-small">'+esc(platform.sampledAt?new Date(platform.sampledAt*1000).toLocaleTimeString('zh-CN'):'未采样')+'</span></div></div></div><div class="ar-overall-strip">'+metric('平台健康',fresh?healthy+'/'+n:'—','运行组件 / 观测组件')+metric('执行中任务',fresh?count('running'):'—','当前运行 · 最近1小时覆盖窗口')+metric('模型链路',platform.dependencyMetrics?.model?.status==='connected'?'已接入 · '+platform.dependencyMetrics.model.counts.requests+' 次':platform.dependencyMetrics?.model?.status==='error'?'采集异常':'等待采样','最近1小时 · API归一化记录')+metric('隔离环境',fresh?(platform.services||[]).filter(x=>['Sandbox','Local sandbox'].includes(x.name)&&x.state==='running').length+' 个在线':'未知','临时执行容器 '+Object.values(sync.executors||{}).filter(x=>x.status==='running').length+' 个运行中')+metric('采集完整性',collectors.length?collectors.filter(x=>x==='active').length+'/'+collectors.length:'—','采集进程状态，完整性另核验')+'</div><div class="ar-situation-grid"><section class="ar-screen-card"><div class="ar-screen-card-title"><h3>任务运行态势</h3><span class="ar-muted ar-small">API 覆盖应用</span></div><div class="ar-state-buckets">'+[['running','运行中'],['queued','排队'],['failed','失败']].map(([k,l])=>'<div><b>'+esc(fresh?count(k):'—')+'</b><span>'+l+'</span></div>').join('')+'</div><div class="ar-wait-graph"><span>活动任务数趋势 · 每 10 秒采样</span>'+trend+'<small>高度表示运行数量；不是吞吐或等待时长</small></div><div class="ar-section-separator"></div><h3>正在发生什么</h3>'+(activeTasks||'<div class="ar-live-empty">'+(sync.live?.errors?.length?'执行 API 采集异常，请检查覆盖详情。':fresh?'当前 API 窗口未发现运行中任务。':'尚无新鲜任务快照。')+'</div>')+'<button class="cursor-interaction" data-goto="task">进入任务回放 →</button></section><section class="ar-screen-card ar-topology-card"><div class="ar-screen-card-title"><h3>平台服务拓扑</h3><span class="ar-muted ar-small">'+n+' 个已观测组件</span></div><div class="ar-topology">'+serviceRows+'</div><div class="ar-observation-rail"><span>观测面</span><b>Dify 执行 API</b><b>执行器 / Trace</b><b>Linux audit</b><b>公网同步</b></div><div id="ar-service-detail" class="ar-service-detail"><strong>点击组件查看运行状态</strong><p class="ar-muted ar-small">容器身份、健康状态、重启次数、OOM 与启动时间。</p><div class="ar-row">'+pill('Redis '+(platform.services?.find(x=>x.name==='Redis')?.health||'未配置探针'))+pill('PostgreSQL '+(platform.services?.find(x=>x.name==='PostgreSQL')?.health||'未配置探针'))+'</div></div></section><section class="ar-screen-card"><div class="ar-screen-card-title"><h3>基础资源与边界</h3><span class="ar-muted ar-small">主机 + 沙箱</span></div>'+[['CPU',resources.cpuPercent==null?'未采集':resources.cpuPercent+'%','主机 CPU 使用率'],['内存',bytes(resources.memoryAvailable),'可用 / '+bytes(resources.memoryTotal)],['磁盘',bytes(resources.diskFree),'可用 / '+bytes(resources.diskTotal)],['容器',healthy+'/'+n,'运行 / 已观测 Dify 服务']].map(([k,v,sub])=>'<div class="ar-resource-row"><div><strong>'+k+'</strong><small>'+sub+'</small></div><span>'+esc(v)+'</span></div>').join('')+'<div class="ar-section-separator"></div><h3>沙箱与内核信号</h3>'+[['审计内核丢失',platform.audit?.lost??'未采集'],['审计队列',platform.audit?.backlog??'未采集'],['审计落盘新鲜度',platform.audit?.logUpdatedAt?Math.round(Date.now()/1000-platform.audit.logUpdatedAt)+' 秒前':'未采集'],['边界事件解释','按任务证据下钻']].map(([k,v])=>'<div class="ar-signal-row"><span>'+k+'</span><small>'+esc(v)+'</small></div>').join('')+'<div class="ar-row" style="margin-top:12px"><button class="cursor-interaction" data-goto="sandbox">沙箱</button><button class="cursor-interaction" data-goto="kernel">内核</button></div></section></div>'+coveragePanel()+'<div class="ar-bottom-grid"><section class="ar-screen-card"><div class="ar-screen-card-title"><h3>异常与影响范围</h3><span class="ar-muted ar-small">当前异常 + 已知缺口</span></div>'+((platform.services||[]).filter(s=>s.health==='unhealthy'||s.state!=='running').map(s=>'<div class="ar-callout">'+esc(s.name)+' · '+esc(s.health||s.state)+'</div>').join('')||'<p class="ar-muted ar-small">'+(fresh?'组件健康快照未报告异常。':'新鲜度不足，不判断平台健康。')+'</p>')+gaps.map(g=>'<div class="ar-incident-row"><span class="ar-incident-marker"></span><div><strong>'+esc(g.source)+' · 历史缺口</strong><p class="ar-muted ar-small">'+esc(g.from)+' → '+esc(g.to)+'<br>'+esc(g.reason)+'</p></div></div>').join('')+'</section><section class="ar-screen-card"><div class="ar-screen-card-title"><h3>数据新鲜度与覆盖</h3><span class="ar-muted ar-small">信任边界</span></div><div class="ar-freshness">'+[['语义层',sync.live?.lastPoll],['主机状态',platform.sampledAt],['同步层',sync.runtimeSyncedAt]].map(([k,v])=>'<div><strong>'+k+'</strong><small>'+esc(v?Math.round(Date.now()/1000-v)+' 秒前':'未接入')+'</small></div>').join('')+'</div><p class="ar-muted ar-small">'+esc(sync.coverage||'等待覆盖信息')+'</p><details><summary>模型链路 / 依赖服务详细指标</summary><div class="ar-code">'+esc(JSON.stringify(platform.dependencyMetrics||{},null,2))+'</div></details><details><summary>采集服务 / 错误与审计原始状态</summary><div class="ar-code">'+esc(JSON.stringify({collectors:platform.collectors,errors:[...(platform.errors||[]),...(sync.live?.errors||[])],audit:platform.audit},null,2))+'</div></details></section></div>'}

const steps=['用户任务','模型与工具','启动沙箱','Python 执行','网络访问','生成结果'];function businessJourney(){let tools=ts(),events=dedupEvents(),research=tools.find(t=>t.name==='run_github_research_sandbox'),r=execution(research),nodes=task?.request?.workflowTrace?.nodes||[],network=events.filter(e=>e.kind==='network'),commands=events.filter(e=>e.kind==='commands');const row=(title,owner,status,body,step)=>'<div class="ar-layer"><strong>'+title+'</strong><div class="ar-track"><div class="ar-row ar-between"><b>'+owner+'</b>'+pill(status,status==='本次有证据'?'ar-green':'ar-amber')+'</div><p>'+esc(body)+'</p>'+(step==null?'':'<button class="cursor-interaction" data-step="'+step+'">查看这一步的证据</button>')+'</div></div>';let parts=[row('接收任务','Dify 应用 / API',task.request?'本次有证据':'未采集','应用：'+(task.appName||task.model||'未记录')+'。已归档用户输入；Web → Nginx → API 的入口请求尚未逐次关联。',0),row('组织执行','Agent / 工作流编排',nodes.length?'本次有证据':'部分证据','API 返回 '+nodes.length+' 个节点或迭代记录；模型和工具上下文可展开查看。组件之间的调用耗时尚未追踪。',1),row('模型与插件','模型服务 / Plugin-Daemon','内部调用待验证','已采集的模型结果来自 Dify API。Plugin-Daemon 的职责来自部署架构，未据此认定本次请求实际经过它。',1),row('调用工具',tools.map(t=>t.name).join(' / ')||'未采集',tools.length?'本次有证据':'未采集','核对工具参数和返回；工具调用不等于命令已执行。',1)];if(research){parts.push(row('启动环境','自定义研究执行器 → 临时 Docker 沙箱',r.container_id?'本次有证据':'身份未关联','容器 '+(r.container_id||'未记录')+'；宿主 PID '+(r.host_pid||'未记录')+'。这是自定义工具执行环境，并非 Dify 代码节点 Sandbox。',2),row('执行代码','Python / research.py',commands.length?'本次有证据':'命令未关联',commands.length+' 条命令证据；退出码 '+(r.exit_code??'未记录')+'。',3),row('访问资料','沙箱进程 → 网络目标',network.length?'本次有证据':'网络未关联',network.length+' 条关联网络记录；连接系统调用不能直接证明 GitHub HTTP 请求成功，需结合工具结果核对。',4),row('交付结果','文件产物 → 工具结果 → Agent 回答',r.files?.length?'本次有证据':'产物未记录',(r.files||[]).join(' / ')||'未采集文件产物',5))}else{parts.push(row('返回结果','工具 / 工作流 → 用户',resultText()?'本次有证据':'结果未采集','此任务未识别固定研究执行器，不套用 Python、临时沙箱或报告生成路线。',5))}return panel('这一次业务，组件如何配合完成','<p class="ar-muted">沿任务理解业务，再展开底层证据。以下是业务阶段与责任映射；只有标记为“本次有证据”的内容有当前任务记录支撑，不表示跨组件调用边全部采集。</p>'+parts.join('')+'<details><summary>配套组件和 AgentReins 在哪里？</summary><p>PostgreSQL：提供持久化；Redis：提供缓存和消息等支撑。本次读写尚未关联。Worker / Worker beat / Agent backend / Dify Sandbox：是否参与本次执行未验证，不自动加入已执行路径。</p><p>AgentReins：旁路采集 Dify API、执行器身份及 Linux audit，关联证据并同步展示。搜索助手只在请求解释时参与，不属于原业务任务。</p></details>')}

async function search(){const request=++searchRequest;let query=root.querySelector('#ar-query').value;state.page='search';queryResult={pending:true};render();try{const result=await get('search?'+new URLSearchParams({q:query,natural:/\b[a-z]+(?:\.[a-z_]+)*:/.test(query)?0:1,offset:state.offset||0,limit:20}));if(request!==searchRequest)return;queryResult=result;render()}catch(e){if(request!==searchRequest)return;queryResult={error:e.message};render()}}function searchGuide(){const lessons=[['1 · 先找到它调用的工具','我想知道这个 Agent 实际调用过什么工具。','tool.name:run_github_research_sandbox','在结果中查看 arguments 和 result：这次工具参数包含 /app/api/.venv/bin/python /work/research.py。工具调用本身还不能证明命令执行。'],['2 · 核对命令是否真的执行','已经知道宿主 PID 是 589906，接着找这个进程的命令证据。','event.category:command AND process.pid:589906','展开完整证据，核对命令路径、参数、时间与容器；再返回所属任务查看执行结果。'],['3 · 追查这个进程的网络行为','还是这个进程，它向外发起了哪些连接？','event.category:network AND process.pid:589906','查看目标地址、端口和内核返回。AUDIT_CONNECT 是连接系统调用证据，不能直接当作 HTTP 请求成功。'],['4 · 把跨层证据放在一起','不想逐类查，用这次执行的 Trace ID 找到关联记录。','trace.id:2a1b5bc986da5fc3872656799b776fc6','对照同一次执行的工具、命令、网络和内核记录，点击返回所属任务查看执行链。'],['5 · 查它最终生成了什么','我只记得它生成过报告，不记得任务 ID。','report.md','展开 FILE_CONTENT_PREVIEW 的完整证据阅读已采集报告正文，再追到所属执行；同名报告可能属于不同历史任务。']];return panel('跟着一条真实历史任务学搜索','<h3>案例：GitHub 项目研究 Agent 在沙箱运行 Python 并生成报告</h3><p class="ar-muted">来自已归档的真实执行，宿主 PID 589906，容器 8b614042ed9b。下面不是要你猜关键词，而是示范如何一步步查清一次行动。点击查询会直接执行，不调用大模型。</p>'+lessons.map(([title,question,q,help])=>'<div class="ar-task"><strong>'+title+'</strong><p>'+question+'</p><div class="ar-row" style="margin:10px 0"><code class="ar-code" style="flex:1">'+esc(q)+'</code><button type="button" class="cursor-interaction" data-example="'+esc(q)+'">试搜这一步</button></div><p class="ar-muted ar-small">搜到后看什么：'+help+'</p></div>').join('')+'<div class="ar-callout" style="margin-top:12px"><strong>换成你自己的调查</strong><p>先搜你知道的工具名或报告名 → 从结果拿到 PID、容器 ID 或 Trace ID → 替换上面查询中的值，继续追查命令和网络。不要把示例 PID 当作所有任务的固定值。</p></div><details><summary>更多搜索写法与覆盖范围</summary><div class="ar-code async function askAssistant(){let box=root.querySelector('#ar-ai-result');let question=root.querySelector('#ar-query').value.trim();if(!question){box.textContent='先在顶部输入想了解的问题。';return}box.textContent='模型正在分析查询和已归档证据…';try{let response=await fetch('/dify/api/assistant',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question})});let job=await response.json();if(!response.ok)throw Error(job.error||response.status);let data;for(let i=0;i<45;i++){await new Promise(resolve=>setTimeout(resolve,2000));data=await get('assistant/'+job.id);if(data.status==='finished')break}if(data?.status!=='finished')throw Error('模型回复尚未到达，请稍后重试');if(data.result.error)throw Error(data.result.error);const r=data.result;box.innerHTML=panel('模型解释 · '+esc(r.model),'<p>'+esc(r.explanation)+'</p><div class="ar-code">'+esc(r.query)+'</div><p class="ar-muted ar-small">'+esc(JSON.stringify(r.limitations||[]))+'</p><button id="ar-apply-ai" class="cursor-interaction">应用这条查询</button>');root.querySelector('#ar-apply-ai').onclick=()=>{root.querySelector('#ar-query').value=r.query;state.offset=0;search()}}catch(e){box.textContent='助手暂不可用：'+e.message}}

async function selectTask(id){const request=++taskRequest;let matches=summaries.filter(j=>groupId(j)===id);const settled=await Promise.allSettled(matches.map(j=>get('journeys?id='+encodeURIComponent(j.id))));if(request!==taskRequest)return;let details=settled.filter(x=>x.status==='fulfilled').flatMap(x=>x.value.journeys||[]);let failures=settled.filter(x=>x.status==='rejected');if(failures.length)console.error('部分任务证据加载失败',failures);let final=details.find(d=>d.id.endsWith(':final'))||details[0];let first=details.find(d=>d.tools?.length)||details[0];if(!final)throw Error('任务详情未能加载，请重试');let tools=new Map();for(let j of details)for(let t of j.relatedTools||j.tools||[])if(t&&typeof t==='object')tools.set(t.id,t);task={...final,runId:id,appName:(first?.request?.workflowTrace||{}).appName,request:first?.request,tools:[...tools.values()]};render();setLoadNotice(failures.length?'部分证据加载失败：'+failures.length+' 条。已显示可用证据，请重试补齐。':'');}

function flightEvents(){if(!task)return [];let result=[],seen=new Set();const add=(id,node,time,title,body,payload)=>{let ms=typeof time==='number'?(time<1e12?time*1000:time):Date.parse(time);if(Number.isFinite(ms))time=new Date(ms).toISOString();if(!Number.isFinite(ms))return;let key=id||node+time+title;if(seen.has(key))return;seen.add(key);result.push({id:key,node,time,ms,title,body,payload})};for(let t of ts()){add(t.id,'tool',t.time,'调用 '+t.name,t.arguments,{arguments:t.arguments,result:t.result});let r=execution(t);if(r.container_id)add(t.id+':runtime','sandbox',t.time,'执行器返回运行身份','容器 '+r.container_id+' · PID '+r.host_pid,{...r,content:undefined});for(let kind of ['commands','network','kernel'])for(let e of t[kind]||[])add(e.eventKey,kind==='commands'?'sandbox':kind==='network'?'network':'executor',e.time,e.operation,e.resource,e)}let nodes=task.request?.workflowTrace?.nodes||[];for(let n of nodes){add('node:'+n.nodeId,'agent',n.start,n.title||n.type,n.status,n)}if(task.response)add('response:'+task.id,'agent',task.time,'已归档模型返回',resultText(),task.response);return result.sort((a,b)=>a.ms-b.ms||a.id.localeCompare(b.id))}

function flightLine(x1,y1,x2,y2,active=false,confirmed=false){return '<path class="fc-edge '+(confirmed?'confirmed':'uncertain')+' '+(active&&flight.playing?'flowing':'')+'" d="M '+x1+' '+y1+' L '+x2+' '+y2+'" marker-end="url(#fc-arrow)"/>'}
function taskView(){flightReset();let ev=flightEvents(),at=ev[Math.min(flight.index,Math.max(0,ev.length-1))],current=flight.selected||at?.node,passed=new Set(ev.slice(0,flight.index+1).map(e=>e.node)),research=ts().find(t=>['run_github_research_sandbox','rea_analyze_frontend'].includes(t.name)),isRea=research?.name==='rea_analyze_frontend',runtime=execution(research),status=id=>id===at?.node&&!flight.selected?'active':passed.has(id)?'done':'unknown';let mapped={user:['用户任务','已采集输入，入口请求逐跳追踪未接入'],nginx:['Nginx','部署组件；本次入口请求未关联'],api:['Dify API','任务和节点来自执行 API，非请求 spans'],agent:['Agent 编排','模型上下文和节点结果来自 Dify API'],plugin:['Plugin-Daemon','架构组件；内部调用尚未逐次追踪'],model:['外部模型','已归档返回；提供商 HTTP 链路未追踪'],tool:['工具调用','工具参数和返回见本次任务记录'],executor:['研究执行器','只有关联执行身份时才确认归属'],sandbox:['临时沙箱','自定义研究工具环境；非通用 Dify Sandbox'],network:['网络目标','连接系统调用不等于 HTTP 成功'],files:['报告文件','查看已采集正文，不推断文件生成时刻'],redis:['Redis','本次读写尚未关联'],postgres:['PostgreSQL','本次 SQL 尚未关联']};let selectedEvents=flight.selected?ev.filter(e=>e.node===flight.selected):at?[at]:[];let title=mapped[current]?.[0]||'等待任务证据',body=mapped[current]?.[1]||'请选择一个历史任务';let graph='';graph+=flightNode('plugin','Plugin-Daemon','内部调用待验证',45,17,'unknown')+flightNode('model','外部 LLM','提供商链路待验证',70,17,'unknown');const line=[['user','用户任务','研究需求'],['nginx','Nginx','反向代理'],['api','Dify API','服务接口'],['agent','Agent 编排','任务规划与调度'],['tool','工具调用',research?(isRea?'REA 静态分析':'GitHub 研究工具'):'当前任务工具'],['executor',isRea?'REA 执行器':'研究执行器',research?'固定工具服务':'未识别执行器'],['sandbox','临时沙箱',research?(isRea?'Node.js / REA':'research.py'):'未关联研究环境'],['network','网络目标',isRea?'分析容器禁网':'连接证据'],['files','报告文件',isRea?'REA 证据 / 分析报告':'report.md / report.json']];for(let i=0;i<line.length;i++){let [id,label,sub]=line[i];graph+=flightNode(id,label,sub,6+i*11,48,status(id))}graph+=flightNode('redis','Redis','本次访问待关联',59,82,'unknown')+flightNode('postgres','PostgreSQL','本次访问待关联',77,82,'unknown');let paths='';for(let i=0;i<8;i++)paths+=flightLine(6+i*11+4.5,48,6+(i+1)*11-4.5,48,false,false);paths+=flightLine(39,40,45,23,false,false)+flightLine(50,17,65,17,false,false)+flightLine(39,56,59,75,false,false)+flightLine(39,56,77,75,false,false);if(runtime.container_id){paths+=flightLine(55,55,72,55,at?.node==='sandbox',true)}if(ev.some(e=>e.node==='network'))paths+=flightLine(76,57,83,57,at?.node==='network',true);let evidence=selectedEvents.map(e=>'<details '+(!flight.selected?'open':'')+'><summary>'+esc(e.time)+' · '+esc(e.title)+'</summary><p>'+esc(String(e.body||'').slice(0,500))+'</p><div class="ar-code">'+esc(JSON.stringify(e.payload,null,2))+'</div></details>').join('');let taskStatus=(sync.live?.runs||[]).find(x=>x.runId===task?.runId)?.status||task?.status||'未记录';return '<div class="fc-taskbar"><div class="fc-task-heading"><span class="fc-task-symbol">▤</span><div><h2>'+esc(task?.appName||'任务执行可视化')+'</h2><p>'+esc((task?.request?.messages||[]).filter(m=>m.role==='user').slice(-1)[0]?.content||'选择历史任务查看实际执行证据')+'</p></div></div><div class="ar-row">'+pill(taskStatus,/fail|error|失败/i.test(taskStatus)?'ar-amber':/success|完成|返回/i.test(taskStatus)?'ar-green':'')+pill(ev.length+' 个事件')+'<button data-flight-mode="live" class="'+(flight.mode==='live'?'fc-on':'')+'">实时采集</button><button data-flight-mode="replay" class="'+(flight.mode==='replay'?'fc-on':'')+'">回放</button></div></div><div class="fc-task-select">'+selectedPicker()+'<span>业务路径 / '+esc(task?.runId||'等待加载')+'</span></div><div class="fc-layout"><section class="fc-canvas"><h3>♧　任务执行拓扑图</h3><div class="fc-architecture-note">虚线：可能经过的组件，尚无调用证据；实线：已采集证据确认的关联</div><div class="fc-graph"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><defs><marker id="fc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4b91b0"/></marker></defs>'+paths+'</svg>'+graph+'</div><div class="fc-idle"><span>本次参与情况未验证</span><div><button data-flight-extra="Worker">▣　Worker</button><button data-flight-extra="Dify Sandbox">▧　Dify Sandbox</button><button data-flight-extra="Agent backend">▰　Agent backend</button></div></div></section><aside class="fc-inspector"><h3>◎　'+(flight.selected?'组件证据':'当前发生')+'</h3><div class="fc-current"><div class="fc-current-icon">'+(flightIcons[current]||'◇')+'</div><h2>'+title+'</h2><p>'+body+'</p>'+(at&&!flight.selected?'<strong>'+esc(at.title)+'</strong><p>'+esc(at.time)+'</p>':'')+'</div><div class="fc-observation"><h3>观测信息</h3>'+kv([['来源','Dify API / 执行器 / Linux audit'],['PID',runtime.host_pid||'未关联'],['容器',runtime.container_id?.slice(0,12)||'未关联'],['Trace',runtime.trace_id||trace()]])+'</div><button class="fc-primary" id="fc-evidence">查看本步证据</button><div class="fc-next"><small>下一个采集事件</small><p>'+esc(ev[flight.index+1]?.title||'已到归档末尾')+'</p></div><div class="fc-legend"><span>🟢 已有事件</span><span>🔵 当前事件</span><span>⚪ 未验证</span></div></aside></div><section class="fc-timeline"><div class="ar-row ar-between"><h3>◷　任务执行时间线</h3><small>按采集事件顺序回放 · 播放速度不代表真实耗时</small></div><div class="fc-playback"><button id="fc-play" '+(!ev.length||flight.mode==='live'?'disabled':'')+'>'+(flight.playing?'Ⅱ':'▶')+'</button><button id="fc-reset">↺</button><select id="fc-speed" aria-label="回放速度"><option '+(flight.speed===1?'selected':'')+' value="1">1×</option><option '+(flight.speed===2?'selected':'')+' value="2">2×</option><option '+(flight.speed===4?'selected':'')+' value="4">4×</option></select><div class="fc-scrubber"><input aria-label="任务事件回放位置" id="fc-position" type="range" min="0" max="'+Math.max(0,ev.length-1)+'" value="'+flight.index+'"><div class="fc-milestones"><span>任务记录</span><span>模型 / 工具</span><span>执行身份</span><span>命令 / 内核</span><span>网络访问</span><span>返回结果</span></div></div><small>'+(ev.length?flight.index+1:0)+' / '+ev.length+'</small></div></section>'+(flight.drawer?panel('当前组件 / 事件证据',evidence||body)+(flight.selected==='files'?taskFiles():''):'')+'<details class="fc-deep"><summary>展开完整业务说明、文件正文与底层证据</summary>'+legacyTaskView()+'</details>'}

function openComponent(id){
 const labels={executor:'执行器',sandbox:'沙箱',network:'网络行为',files:'生成文件',tool:'工具调用',agent:'Agent 编排',model:'模型反馈',api:'Dify API',nginx:'Nginx',user:'用户任务',plugin:'Plugin-Daemon',redis:'Redis',postgres:'PostgreSQL'};
 document.getElementById('ar-component-dialog')?.remove();
 const dialog=document.createElement('dialog');dialog.id='ar-component-dialog';dialog.style.cssText='width:min(1000px,92vw);max-height:88vh;overflow:auto;background:#101e30;color:#e1edf9;border:1px solid #3f789a;border-radius:16px;padding:24px';
 const tools=ts(),r=tools.map(execution).find(x=>x.container_id)||{},events=dedupEvents();
 const evidence=items=>items.length?items.map(e=>'<article class="ar-task"><strong>'+esc(e.operation||e.title)+'</strong><p>'+esc(e.time)+'</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(e.resource||e.body||'未采集命令正文')+'</pre><details><summary>查看原始证据与返回字段</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(JSON.stringify(e,null,2))+'</pre></details></article>').join(''):'<p>本次任务没有采集到此类证据，不能据此判断没有发生。</p>';
 const tabs=['executor','sandbox'].includes(id)?[['summary','执行概况'],['commands','执行命令'],['network','网络访问'],['kernel','内核事件'],['files','输出文件']]:[[id,labels[id]||id]];
 dialog.innerHTML='<div class="ar-row ar-between"><h2>'+esc(labels[id]||id)+' · 本次任务</h2><button data-close aria-label="关闭详情">关闭 ×</button></div><p>查看实际输入、执行位置和结果；切换下方标签继续调查。</p><div class="ar-row">'+tabs.map(([key,label])=>'<button data-detail-tab="'+key+'">'+label+(['commands','network','kernel'].includes(key)?' ('+events.filter(e=>e.kind===key).length+')':'')+'</button>').join('')+'</div><div data-detail-body style="margin-top:20px"></div>';
 const show=key=>{dialog.querySelectorAll('[data-detail-tab]').forEach(b=>{b.style.borderColor=b.dataset.detailTab===key?'#4adbd0':'';b.setAttribute('aria-pressed',String(b.dataset.detailTab===key))});let body='';
 if(key==='summary')body='<h3>这次执行做了什么</h3><p>'+esc(tools.map(t=>t.name).join(' → ')||'未记录工具调用')+'</p>'+kv([['执行位置',r.container_id?'隔离容器':'未关联'],['容器完整 ID',r.container_id||'未采集'],['宿主 PID',r.host_pid||'未采集'],['退出码',r.exit_code??'未采集'],['执行耗时',r.elapsed_seconds??r.duration_seconds??'未采集'],['Trace',r.trace_id||trace()]])+'<h3>执行命令预览</h3>'+evidence(events.filter(e=>e.kind==='commands').slice(0,3))+'<p>点击「执行命令」查看全部命令；点击「输出文件」阅读报告。</p>';
 else if(['commands','network','kernel'].includes(key))body=evidence(events.filter(e=>e.kind===key));
 else if(key==='files')body=taskFiles();
 else if(key==='tool')body=tools.map(t=>'<article class="ar-task"><h3>'+esc(t.name)+'</h3><h4>输入参数</h4><pre style="white-space:pre-wrap">'+esc(typeof t.arguments==='string'?t.arguments:JSON.stringify(t.arguments,null,2))+'</pre><details open><summary>工具返回</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(JSON.stringify(t.result,null,2))+'</pre></details></article>').join('');
 else if(key==='model'||key==='agent')body='<h3>已归档模型反馈</h3><pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(resultText()||'当前任务未采集模型正文')+'</pre>'+evidence(flightEvents().filter(e=>e.node===key));
 else body=evidence(flightEvents().filter(e=>e.node===key));
 dialog.querySelector('[data-detail-body]').innerHTML=body;
 };dialog.querySelectorAll('[data-detail-tab]').forEach(b=>b.onclick=()=>show(b.dataset.detailTab));dialog.querySelector('[data-close]').onclick=()=>dialog.close();dialog.addEventListener('close',()=>dialog.remove());dialog.addEventListener('click',e=>{if(e.target===dialog){const b=dialog.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)dialog.close()}});document.body.append(dialog);show(tabs[0][0]);dialog.showModal();
}

function bindFlight(){root.querySelectorAll('[data-flight-node]').forEach(b=>b.onclick=()=>{flight.selected=b.dataset.flightNode;flight.playing=false;flight.drawer=false;render();openComponent(flight.selected)});root.querySelector('#fc-play')?.addEventListener('click',()=>{flight.selected=null;if(flight.index>=flightEvents().length-1)flight.index=0;flight.playing=!flight.playing;render()});root.querySelector('#fc-reset')?.addEventListener('click',()=>{flight.index=0;flight.selected=null;flight.playing=false;render()});root.querySelector('#fc-position')?.addEventListener('input',e=>{flight.index=+e.target.value;flight.selected=null;flight.playing=false;render()});root.querySelector('#fc-speed')?.addEventListener('change',e=>flight.speed=+e.target.value);root.querySelector('#fc-evidence')?.addEventListener('click',()=>{openComponent(flight.selected||flightEvents()[flight.index]?.node||'executor')});root.querySelectorAll('[data-flight-mode]').forEach(b=>b.onclick=()=>{flight.mode=b.dataset.flightMode;flight.playing=false;flight.selected=null;if(flight.mode==='live')flight.index=Math.max(0,flightEvents().length-1);render()});root.querySelectorAll('[data-flight-extra]').forEach(b=>b.onclick=()=>{flight.playing=false;alert(b.dataset.flightExtra+'：当前仅有组件指标，本次任务参与及调用关系未验证。')})}
let flightTicks=0;setInterval(()=>{if(state.page!=='task'||document.hidden||!flight.playing)return;flightTicks++;if(flightTicks<4/flight.speed)return;flightTicks=0;let events=flightEvents();if(flight.index<events.length-1){flight.index++;flight.selected=null;render()}else{flight.playing=false;render()}},250);

function render(){root.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.page));view.innerHTML=({overview,task:taskView,sandbox,kernel,search:searchView}[state.page])();bindFlight();root.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{state.page=b.dataset.goto;render()});root.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{state.step=Number(b.dataset.step);render()});root.querySelectorAll('[data-service]').forEach(b=>b.onclick=()=>{let service=platform.services?.find(s=>s.name===b.dataset.service);root.querySelector('#ar-service-detail').innerHTML='<strong>'+b.dataset.service+'</strong>'+kv(Object.entries(service||{状态:'未采集'}).map(([k,v])=>[k,v]))+(b.dataset.service==='Redis'?'<h3>Redis INFO 指标</h3>'+kv(Object.entries(platform.dependencyMetrics?.redis||{}).filter(([k])=>k!=='keyValues').map(([k,v])=>[k,v]))+redisContentPanel():b.dataset.service==='PostgreSQL'?'<h3>PostgreSQL readiness</h3>'+kv(Object.entries(platform.dependencyMetrics?.postgres||{}).map(([k,v])=>[k,v])):'');});root.querySelector('#ar-taskpick')?.addEventListener('change',e=>selectTask(e.target.value));root.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{root.querySelector('#ar-events').innerHTML=eventRows(dedupEvents().filter(e=>b.dataset.kind==='all'||e.kind===b.dataset.kind))});root.querySelectorAll('[data-run]').forEach(b=>b.onclick=async()=>{let id=b.dataset.run;if(id==='dependency:redis'){state.page='overview';render();root.querySelector('[data-service="Redis"]')?.click();return}if(id.startsWith('executor:')){let d=await get('search?'+new URLSearchParams({q:id.slice(9),category:'tool',limit:1}));id=d.hits?.[0]?.runId;if(!id){b.textContent='未找到关联任务，请展开完整证据';return}state.page='sandbox'}else state.page='task';await selectTask(id)});root.querySelector('#ar-prev')?.addEventListener('click',()=>{state.offset=Math.max(0,(state.offset||0)-20);search()});root.querySelector('#ar-next')?.addEventListener('click',()=>{state.offset=(state.offset||0)+20;search()});root.querySelector('#ar-platform-refresh')?.addEventListener('click',refresh);root.querySelector('#ar-ai-help')?.addEventListener('click',askAssistant);root.querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>{root.querySelector('#ar-query').value=b.dataset.example;state.offset=0;queryResult=null;search()})}
async function refresh(){if(loading)return;loading=true;try{const results=await Promise.allSettled([get('sync'),get('journeys')]);if(results[0].status==='fulfilled'){sync=results[0].value;platform=sync.platform||{}}else{platform={...platform,sampledAt:0};console.error('同步失败',results[0].reason)}if(results[1].status==='fulfilled')summaries=results[1].value.journeys||[];else console.error('任务列表失败',results[1].reason);render();if(!task&&summaries.length){let requested=new URLSearchParams(location.search).get('task');let chosen=summaries.find(j=>requested&&groupId(j)===requested)||summaries.find(j=>j.counts?.commands>0&&j.id.endsWith(':final'))||summaries[0];await selectTask(groupId(chosen))}if(state.page==='task'&&flight.mode==='live'&&task){await selectTask(task.runId);flight.index=Math.max(0,flightEvents().length-1);render()}root.querySelector('.ar-proto').textContent=results[0].status==='rejected'?'实时同步暂不可用 · 历史任务可独立查看':sync.runtimeSyncedAt?'最近同步 '+new Date(sync.runtimeSyncedAt*1000).toLocaleTimeString('zh-CN'):'等待数据同步';if(results[1].status==='rejected')setLoadNotice('任务列表加载失败，请重试。');else if(!summaries.length)setLoadNotice('暂无已归档任务。')}catch(e){console.error('任务加载异常',e);setLoadNotice('任务加载失败：'+e.message)}finally{loading=false}}

root.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.page=b.dataset.view;render()});root.querySelector('#ar-searchform').onsubmit=e=>{e.preventDefault();state.offset=0;queryResult=null;search()};root.querySelector('#ar-retry').onclick=()=>{task=null;refresh()};render();refresh();setInterval(()=>{if(!document.hidden)refresh()},10000);
})();
</script>
