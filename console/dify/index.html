<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AgentReins · Dify 验收工作台</title>
<link rel="icon" href="/dify/favicon.svg"/><meta name="description" content="按任务验收 Dify：模型、工具、沙箱、内核与文件证据。"/><meta property="og:image" content="https://www.agentreins.info/dify/social.png"/><style>:root{--bg:#07111c;--panel:#0c1a2b;--line:#1e3a55;--text:#e7f2ff;--muted:#8aa4bf;--blue:#4ec4ff;--green:#3dd6a5;--warn:#f0b429;--bad:#ff6b6b;--radius:12px}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--text)}
.banner-mock{background:#3a2a00;color:#ffd666;text-align:center;padding:6px 10px;font-size:12px}
.top{display:flex;justify-content:space-between;gap:16px;padding:14px 18px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#08182a,#0a2034)}
.brand{font-size:18px;font-weight:700;letter-spacing:.04em}.brand span{font-weight:500;color:var(--blue);font-size:13px;margin-left:6px}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
.health{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.pill{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted)}
.pill.ok{border-color:#1f6b52;color:var(--green)}.pill.warn{border-color:#7a5b10;color:var(--warn)}.pill.bad{border-color:#7a2a2a;color:var(--bad)}
.tabs{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);overflow:auto}
.tab{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--text);border-color:var(--blue);box-shadow:inset 0 -2px 0 var(--blue)}
main{padding:16px;max-width:1200px;margin:0 auto}
.coach{max-width:1200px;margin:0 auto 24px;padding:0 16px;color:var(--muted);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.grow{flex:1;min-width:240px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
select,input,button.primary,button.ghost{font:inherit}
select,input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#06101c;color:var(--text)}
button.primary{background:var(--blue);color:#032033;border:0;border-radius:8px;padding:10px 14px;font-weight:600;cursor:pointer}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;cursor:pointer}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.step{border:1px dashed var(--line);border-radius:10px;padding:10px;text-align:center;color:var(--muted);font-size:12px}
.step.done{border-style:solid;border-color:#1f6b52;color:var(--green)}
.step.active{border-style:solid;border-color:var(--blue);color:var(--blue);background:#0a2438}
.nodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.node{border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:#081624;text-align:left;color:inherit}
.node:hover,.node.on{border-color:var(--blue)}
.node .t{font-weight:600}.node .s{font-size:12px;color:var(--muted);margin-top:4px}
.badge{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-right:4px;color:var(--muted)}
.badge.empty{color:var(--warn);border-color:#7a5b10}
.drawer h3{margin:0 0 8px}.drawer .meta{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500}
.file{white-space:pre-wrap;background:#06101c;border:1px solid var(--line);border-radius:8px;padding:12px;font-family:ui-monospace,monospace;font-size:12px;max-height:280px;overflow:auto}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.tag-mock{display:inline-block;background:#3a2a00;color:#ffd666;font-size:11px;padding:2px 6px;border-radius:4px;margin-left:6px}
.empty{padding:18px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center}
@media(max-width:440px){
  .steps{grid-template-columns:1fr 1fr; } .top{flex-direction:column}
  .nodes{grid-template-columns:1fr 1fr}
}

/* Keep the reviewed prototype layout; constrain long real evidence on mobile. */
main,.card,.grow{min-width:0}.grow{min-width:min(240px,100%)}.card,.meta,.hint,.node,td{overflow-wrap:anywhere}h3{margin:16px 0 8px}.table-scroll{overflow:auto;max-width:100%}.table-scroll table{min-width:600px}.file{max-width:100%;word-break:break-word}.check{margin:12px 0}.check input{width:auto}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:3px}.notice{padding:12px;border:1px solid var(--warn);color:var(--warn)}details{margin:10px 0}summary{cursor:pointer}.meta{font-size:12px;color:var(--muted)}
.badge.empty{padding:1px 6px;border-style:solid;text-align:left}</style>
</head>
<body>

<header class="top">
  <div>
    <div class="brand">AGENTREINS <span>验收工作台</span></div>
    <div class="sub" id="syncLine">同步状态加载中…</div>
  </div>
  <div class="health" id="healthPills"></div>
</header>

<nav class="tabs" role="tablist">
  <button class="tab on" data-view="task">① 选任务验收</button>
  <button class="tab" data-view="global">全局健康</button>
  <button class="tab" data-view="search">证据搜索</button>
</nav>

<main id="app"></main>

<aside class="coach" id="coach">
  <strong>人带着智能体干活，产出交给人验收</strong>
  <p>验收路径：选任务 → 点组件 → 看命令/网络/内核 → 打开文件 → 搜索回到任务。</p>
</aside>

<script>'use strict';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text=v=>typeof v==='string'?v:JSON.stringify(v??'',null,2), arr=v=>Array.isArray(v)?v:[], pretty=v=>`<pre class="file">${esc(text(v))}</pre>`, empty=s=>`<div class="empty">${esc(s)}</div>`;
const state={view:'task',taskId:new URLSearchParams(location.search).get('task')||'',component:null,pathStep:0,searchQ:'',offset:0,pack:null,details:[],loading:false,error:'',searchError:'',busy:false,natural:false,assistant:null};
let sync={},journeys=[],syncError='',taskSeq=0,searchSeq=0;
const group=j=>j.runId||j.id?.split(':')[0], tools=()=>[...new Map(state.details.flatMap(j=>arr(j.relatedTools||j.tools)).filter(t=>t&&typeof t==='object').map(t=>[t.id||JSON.stringify(t),t])).values()];
const parsed=t=>{try{return JSON.parse(t.result?.content||'{}')}catch{return {}}};
const unique=xs=>[...new Map(xs.map(x=>[x.eventKey||x.id||JSON.stringify(x),x])).values()];
const events=k=>unique(tools().flatMap(t=>arr(t[k])));
const files=()=>{const ids=new Set(tools().map(t=>parsed(t).run_id).filter(Boolean));return arr(sync.platform?.dependencyMetrics?.artifacts).filter(f=>ids.has(f.executionId))};
const fmt=v=>!v?'未采集':new Date(typeof v==='number'?v*1000:v).toLocaleString('zh-CN');
async function api(path,options={}){const r=await fetch('/dify/api/'+path,{...options,signal:AbortSignal.timeout(25000)});let d;try{d=await r.json()}catch{throw Error('响应不是完整 JSON（HTTP '+r.status+'）')}if(!r.ok)throw Error(d.error||'HTTP '+r.status);return d}
function health(){const live=sync.live||{},p=sync.platform||{},errors=[...arr(live.errors),...arr(p.errors)],age=live.lastPoll?Math.max(0,Math.floor(Date.now()/1000-live.lastPoll)):null,sv=arr(p.services),fresh=age!==null&&age<120&&!syncError;
$('syncLine').textContent=`公网同步 ${fmt(sync.runtimeSyncedAt)} · 源端 ${fmt(live.lastPoll)}${age===null?'':`（${age}s 前）`}`;
$('healthPills').innerHTML=`<span class="pill ${syncError||errors.length?'bad':'ok'}">${syncError?'同步失败':'采集错误 '+errors.length}</span><span class="pill ${fresh?'ok':'warn'}">${fresh?'源端新鲜':'源端过期 / 未知'}</span><span class="pill">服务 ${sv.filter(s=>s.state==='running'&&s.health!=='unhealthy').length}/${sv.length} · ${p.sampledAt&&Date.now()/1000-p.sampledAt<120?'新鲜':'快照过期 / 未知'}</span><span class="pill">归档 ${sync.archiveCounts?.journey??'—'} 条交互</span>`}
function steps(){return `<div class="steps">${['选任务','点组件','看证据','读文件','搜索回任务'].map((v,i)=>`<div class="step ${i<state.pathStep?'done':''} ${i===state.pathStep?'active':''}">${i+1}. ${v}</div>`).join('')}</div>`}
function node(id,title,subtitle,n){return `<button class="node" data-node="${id}"><div class="t">${esc(title)}</div><div class="s">${esc(subtitle)}</div><span class="badge ${n?'':'empty'}">${n?'有证据':'无本次证据'}</span></button>`}
function raw(x){return `<details><summary>查看原始证据</summary>${pretty(x)}</details>`}
function table(rows,fields){if(!rows.length)return empty('当前任务没有这类已关联证据；不据此判断行为没有发生。');return `<div class="table-scroll"><table><thead><tr>${fields.map(([l])=>`<th>${l}</th>`).join('')}<th>证据</th></tr></thead><tbody>${rows.map(r=>`<tr>${fields.map(([,k])=>`<td>${esc(text(r[k]??'未记录'))}}</td>`).join('')}<td>${raw(r)}</td></tr>`).join('')}</tbody></table></div>`}
function taskView(){const ts=tools(),cs=events('commands'),ks=events('kernel'),ns=events('network'),fs=files();const groups=[...new Map(journeys.map(j=>[group(j),j])).entries()];const status=state.loading?empty('正在加载任务证据…'):state.error?`<div class="notice">${esc(state.error)} <button class="ghost" id="retry">重新加载</button></div>`:'';
if(state.component)return steps()+status+panel(state.component);
return steps()+`<div class="card"><label for="taskpick">选择要验收的任务</label><select id="taskpick"><option value="">请选择任务</option>${groups.map(([id,j])=>`<option value="${esc(id)}" ${id===state.taskId?'selected':''}>${esc(j.appName||j.client||'未命名任务')} · ${esc(fmt(j.time))} · ${esc(id.slice(0,8))}</option>`).join('')}</select><p class="hint">同一次任务的模型交互合并展示。点击组件查看它在这次任务中做了什么。</p>${status}${state.taskId?`<p class="meta">任务 ${esc(state.taskId)} · 已加载 ${state.details.length} 次交互 <button class="ghost" id="retry">刷新任务</button></p><div class="nodes">${node('user','用户任务','查看输入与需求',state.details.length)}${node('model','模型反馈',state.details.length+' 次交互',state.details.length)}${node('tool','工具调用',ts.length+' 次调用',ts.length)}${node('executor','执行器 / 沙箱',cs.length+' 条命令',cs.length)}${node('network','网络行为',ns.length+' 条关联事件',ns.length)}${node('kernel','内核证据',ks.length+' 条关联事件',ks.length)}${node('files','输出文件',fs.length+' 个文件预览',fs.length)}${node('redis','Redis','平台依赖 · 非本任务边',0)}</div>`:empty('选择一个已归档任务开始验收。')}</div>`}
function panel(id){const ts=tools(),title={user:'用户任务',model:'模型反馈',tool:'工具调用',executor:'命令与执行位置',kernel:'内核证据',network:'网络行为',files:'输出文件',redis:'Redis · 平台依赖'}[id];let body='';
if(id==='user')body=state.details.map(d=>`<details open><summary>交互 ${esc(d.id)}</summary>${arr(d.request?.messages).filter(m=>m.role==='user').map(m=>pretty(m.content)).join('')||empty('本交互未记录用户消息。')}</details>`).join('');
if(id==='model')body=state.details.map(d=>`<details open><summary>${esc(d.model||'模型')} · ${esc(fmt(d.time))}</summary><p class="meta">${esc(d.id)} · ${esc(d.status)}</p>${arr(d.response?.choices).map(c=>pretty(c.message?.content||c.delta?.content||'本次没有文本回复')).join('')||empty('未采集到模型响应正文。')}${raw(d.response||{})}</details>`).join('');
if(id==='tool')body=ts.map(t=>`<details open><summary>${esc(t.name)} · ${esc(fmt(t.time))}</summary><p class="meta">工具 ID ${esc(t.id)}</p><label>调用参数</label>${pretty(t.arguments)}<label>返回结果</label>${pretty(t.result?.content??t.result)}<p class="hint">${esc(t.associationNote||'')}</p></details>`).join('')||empty('本任务未记录工具调用。');
if(id==='executor')body=ts.filter(t=>t.runtimeContainerId||t.runtimeHostPid||arr(t.commands).length).map(t=>`<div class="card"><strong>${esc(t.name)}</strong><p class="meta">业务任务 ${esc(state.taskId)}<br>工具 ID ${esc(t.id)}<br>执行 ID ${esc(parsed(t).run_id||'未记录')}<br>容器 ${esc(t.runtimeContainerId||'未记录')} · PID ${esc(t.runtimeHostPid||'未记录')}<br>Trace ${esc(t.traceId||'未记录')} · 执行退出码 ${esc(parsed(t).exit_code??'未记录')}</p><p class="hint">${esc(t.associationNote||'')}</p></div>`).join('')+table(events('commands'),[['时间','time'],['进程','process'],['命令 / 资源','resource'],['结果','result']]);
if(id==='kernel'||id==='network')body=table(events(id),[['时间','time'],['操作','operation'],['进程','process'],['PID','pid'],['资源','resource'],['结果','result']])+`<p class="hint">关联依据以原始证据为准。命令启动成功不等于整个任务成功。</p>`;
if(id==='files')body=files().map(f=>`<details open><summary>${esc(f.name)} · ${esc(f.size)} bytes ${f.truncated?'· 预览截断':''}</summary><p class="meta">执行 ID ${esc(f.executionId)}</p>${pretty(f.preview??'未采集正文')}</details>`).join('')||empty('当前任务没有匹配到文件预览。未采集或超出归档范围的内容无法回放。');
if(id==='redis')body=empty('当前没有将 Redis 操作可靠关联到此任务的证据。以下为平台采样，不代表本任务调用。')+pretty(sync.platform?.dependencyMetrics?.redis||'未采集');
let next=['executor','tool'].includes(id)?'<button class="primary" data-node="kernel">查看内核</button> <button class="ghost" data-node="network">查看网络</button>':id==='kernel'?'<button class="primary" data-node="files">下一步：读文件</button>':id==='files'?'<button class="primary" id="toSearch">用搜索回到任务</button>':'';
return `<div class="card drawer"><button class="ghost" id="backNodes">← 返回组件</button><h3>${title}</h3>${body}<p>${next}</p></div>`}
function globalView(){const p=sync.platform||{},errors=[...arr(p.errors),...arr(sync.live?.errors)];return `<div class="card"><h3>全局健康</h3><p class="hint">平台服务状态与当前任务证据分开展示。点击服务查看采集内容。</p>${syncError?empty(syncError):''}<div class="nodes">${arr(p.services).map((s,i)=>`<button class="node" data-service="${i}"><div class="t">${esc(s.name)}</div><div class="s">${esc(s.state)} / ${esc(s.health||'无健康探针')}</div></button>`).join('')}</div><div id="serviceDetail"></div><h3>采集错误</h3>${errors.length?pretty(errors):empty('最近一次快照未报告错误。请同时核对顶部新鲜度。')}<h3>资源与审计</h3>${pretty({resources:p.resources,audit:p.audit,collectors:p.collectors})}<h3>依赖采集</h3>${Object.entries(p.dependencyMetrics||{}).filter(([k])=>!['artifacts','sourceFiles'].includes(k)).map(([k,v])=>`<details><summary>${esc(k)}</summary>${pretty(v)}</details>`).join('')}<p class="hint">${esc(sync.coverage)}</p></div>`}
function searchView(){const pack=state.pack;const examples=[...new Set([(files().find(f=>f.name==='report.md')||files()[0])?.name||'report.md',state.taskId?'task.id:'+state.taskId:'event.category:command','event.category:kernel'])];return `<div class="card"><h3>证据搜索</h3><div class="row"><div class="grow"><label for="sq">搜索已归档证据</label><input id="sq" value="${esc(state.searchQ)}" placeholder="输入文件名、工具名或 task.id:任务编号"></div><button class="primary" id="doSearch">${state.busy?'搜索中…':'搜索'}</button></div><label class="check"><input type="checkbox" id="natural" ${state.natural?'checked':''}> 将自然语言转换为查询条件</label><p class="hint">从真实任务开始：${examples.map(q=>`<button class="ghost sug" data-q="${esc(q)}">${esc(q)}</button>`).join(' ')}</p><p class="hint">文件名查产物，task.id 查整次任务，event.category:command 查命令。支持 AND、OR、通配符；结果来自服务端分页。</p>${state.searchError?empty(state.searchError):''}${pack?`<p>${pack.total} 条命中 · 当前 ${state.offset+1}–${state.offset+pack.hits.length}</p><p class="hint">归档范围 ${esc(pack.coverage?.from)} → ${esc(pack.coverage?.to)}</p>${pack.translation?pretty(pack.translation):''}${pack.hits.length?`<div class="table-scroll"><table><thead><tr><th>类别</th><th>摘要 / 内容</th><th>任务</th><th>操作</th></tr></thead><tbody>${pack.hits.map((h,i)=>`<tr><td>${esc(h.category)}</td><td>${esc(h.text)}<details><summary>打开证据 / 文件内容</summary>${pretty(h.payload)}</details></td><td>${esc(h.runId||'未关联')}</td><td>${resolveRun(h.runId)?`<button class="ghost go-task" data-run="${esc(resolveRun(h.runId))}">回任务</button>`:'未关联业务任务'}</td></tr>`).join('')}</tbody></table></div>`:empty('没有匹配结果。试试上方历史示例，或扩大查询范围。')}<p><button class="ghost" id="prev" ${state.offset===0?'disabled':''}>上一页</button> <button class="ghost" id="next" ${state.offset+pack.hits.length>=pack.total?'disabled':''}>下一页</button></p>`:empty('点击上方示例或输入问题开始搜索。')}</div><div class="card"><h3>只读助手</h3><label for="question">你想了解什么？</label><input id="question" placeholder="例如：这次任务生成了哪些文件？"><p class="hint">点击后将问题与脱敏证据摘要发送给模型。先核对解释，再应用查询；不会执行命令。</p><button class="ghost" id="ask">生成解释</button><div id="assistantOut">${assistantHTML()}</div></div>`}
function assistantHTML(){const a=state.assistant;if(!a)return '';return pretty(a)+(a.query?'<button class="primary" id="applyQuery">应用查询</button>':'')}
function resolveRun(id){if(journeys.some(j=>group(j)===id))return id;return null}
function render(){health();document.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('on',b.dataset.view===state.view);b.setAttribute('aria-selected',String(b.dataset.view===state.view))});$('app').innerHTML=state.view==='task'?taskView():state.view==='global'?globalView():searchView();bind()}
function bind(){document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});if($('taskpick'))$('taskpick').onchange=e=>selectTask(e.target.value);document.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{state.component=b.dataset.node;state.pathStep=state.component==='files'?3:2;render()});if($('backNodes'))$('backNodes').onclick=()=>{state.component=null;render()};if($('retry'))$('retry').onclick=()=>selectTask(state.taskId);if($('toSearch'))$('toSearch').onclick=()=>{state.view='search';state.pathStep=4;state.searchQ=(files().find(f=>f.name==='report.md')||files()[0])?.name||'report.md';search(0)};if($('doSearch'))$('doSearch').onclick=()=>{state.searchQ=$('sq').value.trim();state.natural=$('natural').checked;search(0)};if($('sq'))$('sq').onkeydown=e=>{if(e.key==='Enter')$('doSearch').click()};document.querySelectorAll('.sug').forEach(b=>b.onclick=()=>{state.searchQ=b.dataset.q;search(0)});document.querySelectorAll('.go-task').forEach(b=>b.onclick=()=>{state.view='task';selectTask(b.dataset.run)});if($('prev'))$('prev').onclick=()=>search(Math.max(0,state.offset-20));if($('next'))$('next').onclick=()=>search(state.offset+20);document.querySelectorAll('[data-service]').forEach(b=>b.onclick=()=>{$('serviceDetail').innerHTML=pretty(sync.platform.services[Number(b.dataset.service)])});if($('ask'))$('ask').onclick=ask;if($('applyQuery'))$('applyQuery').onclick=()=>{state.searchQ=state.assistant.query;state.natural=false;search(0)}}
async function selectTask(id){const seq=++taskSeq;state.taskId=id;state.component=null;state.details=[];state.error='';state.loading=true;state.pathStep=1;const url=new URL(location.href);url.searchParams.set('task',id);history.replaceState(null,'',url);render();const matches=journeys.filter(j=>group(j)===id);const results=[];for(let i=0;i<matches.length;i+=3){if(seq!==taskSeq)return;results.push(...await Promise.allSettled(matches.slice(i,i+3).map(j=>api('journeys?id='+encodeURIComponent(j.id)))))}if(seq!==taskSeq)return;state.details=results.filter(x=>x.status==='fulfilled').flatMap(x=>arr(x.value.journeys));state.error=results.some(x=>x.status==='rejected')?'部分交互加载失败，已展示可用证据。':!state.details.length?'没有可用详情。':'';state.loading=false;render()}
async function search(offset){const seq=++searchSeq;state.offset=offset;state.busy=true;state.searchError='';render();try{const pack=await api('search?'+new URLSearchParams({q:state.searchQ,offset,limit:20,natural:state.natural?'1':'0'}));if(seq!==searchSeq)return;state.pack=pack}catch(e){if(seq!==searchSeq)return;state.searchError=e.message;state.pack=null}state.busy=false;render()}
async function ask(){const question=$('question').value.trim();if(!question)return;const button=$('ask');button.disabled=true;state.assistant={status:'提交中'};$('assistantOut').innerHTML=assistantHTML();try{const job=await api('assistant',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question})});for(let i=0;i<60;i++){await new Promise(r=>setTimeout(r,2000));const r=await api('assistant/'+encodeURIComponent(job.id));state.assistant=r.result||{status:r.status};if($('assistantOut')){$('assistantOut').innerHTML=assistantHTML();if($('applyQuery'))$('applyQuery').onclick=()=>{state.searchQ=state.assistant.query;state.natural=false;search(0)}}if(r.status==='finished'||r.status==='failed')break;if(i===59)state.assistant={error:'等待超时，请稍后重试'}}}catch(e){state.assistant={error:e.message}}finally{if($('assistantOut'))$('assistantOut').innerHTML=assistantHTML();if($('ask'))$('ask').disabled=false;if($('applyQuery'))$('applyQuery').onclick=()=>{state.searchQ=state.assistant.query;state.natural=false;search(0)}}}
async function refresh(initial=false){const rs=await Promise.allSettled([api('sync'),api('journeys')]);if(rs[0].status==='fulfilled'){sync=rs[0].value;syncError=''}else syncError=rs[0].reason.message;if(rs[1].status==='fulfilled')journeys=arr(rs[1].value.journeys);else if(initial)state.error='任务列表加载失败：'+rs[1].reason.message;if(initial){render();const id=state.taskId||group(journeys.find(j=>j.counts?.commands>0)||journeys[0]||{});if(id)await selectTask(id)}else health()}
render();refresh(true);setInterval(()=>refresh().catch(()=>{}),15000);
</script>
